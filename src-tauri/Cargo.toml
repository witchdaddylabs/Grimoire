[package]
name = "grimoire"
version = "0.1.0"
description = "A local-first writing studio with memory."
authors = ["Witch Daddy Labs"]
license = "MIT"
repository = "https://github.com/witchdaddylabs/grimoire"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
