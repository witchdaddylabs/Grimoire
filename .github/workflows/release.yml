name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: intel
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned DMG
        run: npm run package:mac -- --target ${{ matrix.target }}

      - name: Generate checksums
        run: shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg > checksums-${{ matrix.arch }}-sha256.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            checksums-${{ matrix.arch }}-sha256.txt

  publish-draft-release:
    name: Publish draft release
    runs-on: ubuntu-latest
    needs: build-macos-dmg

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: grimoire-*
          path: release-artifacts
          merge-multiple: true

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: release-artifacts/*
          body: |
            This is an unsigned, not-notarized community build of Grimoire.

            macOS may block first launch. After the first blocked launch, open System Settings > Privacy & Security and choose Open Anyway if you trust this release.

            Download only from the official GitHub release page.
