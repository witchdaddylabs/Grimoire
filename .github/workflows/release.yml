name: Build & Release DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (ad-hoc signed)
        run: npm run tauri -- build --ci

      - name: Create DMG with uninstall-quarantine helper
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Grimoire.app"
          STAGING="$(mktemp -d)"
          
          cp -R "$APP_PATH" "$STAGING/Grimoire.app"
          ln -s /Applications "$STAGING/Applications"
          
          # Simple double-click script to remove Gatekeeper quarantine
          cat > "$STAGING/🔓 Unlock-Grimoire.command" << 'SCRIPT'
          #!/bin/bash
          xattr -dr com.apple.quarantine /Applications/Grimoire.app 2>/dev/null
          echo ""
          echo "✅ Gatekeeper quarantine removed."
          echo "You can now open Grimoire from Applications."
          echo ""
          open -a Grimoire 2>/dev/null
          SCRIPT
          chmod +x "$STAGING/🔓 Unlock-Grimoire.command"
          
          DMG_PATH="src-tauri/target/release/bundle/dmg/Grimoire_aarch64.dmg"
          mkdir -p "$(dirname "$DMG_PATH")"
          hdiutil create -srcfolder "$STAGING" -volname "Grimoire" -fs HFS+ -format UDZO -size 50m "$DMG_PATH"
          rm -rf "$STAGING"

      - name: Generate checksum
        run: shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg > grimoire-dmg-sha256.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grimoire-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            grimoire-dmg-sha256.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            grimoire-dmg-sha256.txt
          body: |
            ## Installation

            1. Open the DMG
            2. Drag **Grimoire** to **Applications**
            3. In the DMG, double-click **🔓 Unlock-Grimoire.command**
            4. Open Grimoire from Applications — no Gatekeeper warnings!

            **Why?** This build uses ad-hoc signing (no Apple Developer account). macOS flags ad-hoc-only apps from the internet. The unlock script removes this flag so it opens normally.

            Only install from the official [Witch Daddy Labs](https://github.com/witchdaddylabs/Grimoire) release.
