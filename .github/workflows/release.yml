name: Build & Release DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos-dmg:
    name: Build unsigned macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned DMG
        run: npm run tauri -- build --bundles dmg --ci
        env:
          TAURI_SIGNING_IDENTITY: ""

      - name: Ad-hoc sign the DMG
        run: |
          DMG_PATH=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          codesign -s - --timestamp=none --preserve-metadata=identifier,entitlements "$DMG_PATH"
          echo "Signed: $DMG_PATH"

      - name: Generate checksum
        run: shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg > grimoire-dmg-sha256.txt

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grimoire-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            grimoire-dmg-sha256.txt

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            grimoire-dmg-sha256.txt
          body: |
            Grimoire is a local-first macOS writing studio for novelists, storytellers, and world-builders.

            This build is ad-hoc signed (no Apple Developer account required).

            Install:
            1. Download the DMG attached to this release.
            2. Open the DMG and drag Grimoire to Applications.
            3. On first launch, if macOS shows a warning, right-click the app and choose Open, or go to System Settings > Privacy & Security and click Open Anyway.

            Only bypass Gatekeeper if you downloaded this build from the official Witch Daddy Labs GitHub release.
